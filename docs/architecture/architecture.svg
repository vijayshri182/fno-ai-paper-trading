  <text x="34" y="228" font-size="11" fill="#1f2328" font-weight="600">RiskManager</text>
  <text x="34" y="243" font-size="10" fill="#57606a">static caps: max_position / max_order_notional / max_daily_loss</text>
  <text x="34" y="257" font-size="10" fill="#57606a">RiskDecision(approved, reasons)</text>

