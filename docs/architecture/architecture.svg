  <text x="404" y="243" font-size="10" fill="#57606a">risk_per_trade_pct &#215; stop_loss_pct &#8594; quantity</text>
  <text x="404" y="257" font-size="10" fill="#57606a">SizingResult(approved, quantity, skip_reason)</text>

